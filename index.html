<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Uma surpresa mágica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="invitation-page">
    <main class="invitation">
      <span class="sparkle sparkle-left" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-right" aria-hidden="true">✧</span>

      <section class="invitation-card" aria-labelledby="invitation-title">
        <p class="eyebrow">Um convite muito especial</p>
        <p class="gift" aria-hidden="true">🎁</p>
        <h1 id="invitation-title">Preparados para<br />mais uma surpresa?</h1>
        <p class="intro">
          Tem uma nova aventura chegando para vocês — e ela vem cheia de magia.
        </p>
        <a class="button" href="surpresa/">Abrir a surpresa <span aria-hidden="true">→</span></a>
      </section>
    </main>

    <p class="footer-note">Feito com muito carinho para vocês ♡</p>
  </body>
</html>
